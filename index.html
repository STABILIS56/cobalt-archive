<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Архив «Кобальт» // Доступ по коду</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: radial-gradient(circle at center, #1a0a00 0%, #000000 100%);
            color: #FF6600;
            font-family: 'Courier New', monospace;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .terminal {
            max-width: 600px;
            width: 100%;
            background: rgba(0,0,0,0.9);
            border: 1px solid #FF6600;
            box-shadow: 0 0 20px rgba(255,102,0,0.3);
            padding: 2rem;
            border-radius: 8px;
            text-align: center;
        }
        .logo {
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 4px;
            margin-bottom: 1rem;
            text-shadow: 0 0 5px #FF6600;
        }
        .sub {
            margin-bottom: 2rem;
            border-left: 3px solid #FF6600;
            padding-left: 1rem;
            text-align: left;
        }
        .input-area {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            margin-bottom: 1rem;
        }
        input {
            background: #000;
            border: 1px solid #FF6600;
            color: #FF6600;
            padding: 0.5rem;
            font-family: monospace;
            width: 60%;
            outline: none;
        }
        button {
            background: #FF6600;
            border: none;
            color: #000;
            font-weight: bold;
            padding: 0.5rem 1rem;
            cursor: pointer;
            font-family: monospace;
        }
        .error { color: #F44; margin-top: 0.5rem; }
        .footer {
            margin-top: 2rem;
            font-size: 0.7rem;
            border-top: 1px dashed #FF6600;
            padding-top: 1rem;
        }
    </style>
</head>
<body>
<div class="terminal">
    <div class="logo">/// КОБАЛЬТ ///</div>
    <div class="sub">Независимый архив. Введите код доступа для получения рассекреченных материалов.</div>
    <div class="input-area">
        <input type="text" id="cobaltCode" placeholder="[ ACCESS CODE ]" autocomplete="off">
        <button id="cobaltBtn">АКТИВИРОВАТЬ</button>
    </div>
    <div id="errorMsg" class="error"></div>
    <div class="footer">Анонимный архив. Правда не может быть засекречена.</div>
</div>
<script>
    const codes = {
        "COBALT-01": "cobalt_victory.html"
    };
    let failed = 0;
    document.getElementById("cobaltBtn").addEventListener("click", () => {
        const code = document.getElementById("cobaltCode").value.trim().toUpperCase();
        const errDiv = document.getElementById("errorMsg");
        if (codes[code]) {
            window.location.href = codes[code];
        } else {
            failed++;
            errDiv.innerText = `ДОСТУП ЗАПРЕЩЁН // ПОПЫТКА ${failed}`;
            if (failed >= 3) errDiv.innerText += " // ДОСТУП ЗАБЛОКИРОВАН НА 60 СЕКУНД";
            setTimeout(() => { errDiv.innerText = ""; }, 3000);
        }
        document.getElementById("cobaltCode").value = "";
    });
    document.getElementById("cobaltCode").addEventListener("keypress", (e) => {
        if (e.key === "Enter") document.getElementById("cobaltBtn").click();
    });
</script>
</body>
</html>
