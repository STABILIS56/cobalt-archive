<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Архив «Кобальт» // Терминал доступа</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: radial-gradient(circle at 30% 10%, #0a0500 0%, #000000 100%);
            color: #FF6600;
            font-family: 'Courier New', monospace;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            font-size: 1rem;
        }
        .terminal {
            max-width: 750px;
            width: 100%;
            background: rgba(10, 5, 0, 0.85);
            border: 1.5px solid #FF6600;
            box-shadow: 0 0 25px rgba(255, 102, 0, 0.4);
            padding: 1.8rem;
            border-radius: 12px;
        }
        .header {
            border-bottom: 1px solid #FF6600;
            margin-bottom: 1.8rem;
            padding-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
        }
        .logo { font-size: 1.4rem; font-weight: bold; letter-spacing: 3px; text-shadow: 0 0 4px #FF6600; }
        .status { font-size: 0.75rem; color: #ffaa66; font-style: italic; }
        .sys-msg {
            font-family: monospace;
            font-size: 0.85rem;
            color: #ffaa66;
            margin: 0.3rem 0;
            border-left: 2px solid #FF6600;
            padding-left: 0.6rem;
        }
        .cli {
            margin: 1.5rem 0 1rem;
            background: #0a0500;
            padding: 1rem;
            border: 1px solid #FF6600;
            border-radius: 6px;
        }
        .prompt { color: #FF6600; font-weight: bold; }
        .input-line { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
        #cobaltInput {
            background: transparent;
            border: none;
            color: #FF6600;
            font-family: monospace;
            font-size: 1rem;
            width: 70%;
            outline: none;
            caret-color: #FF6600;
        }
        button {
            background: #FF6600;
            border: none;
            color: #000;
            font-weight: bold;
            padding: 0.4rem 1rem;
            font-family: monospace;
            font-size: 0.9rem;
            cursor: pointer;
            border-radius: 4px;
        }
        button:hover { background: #ff9933; box-shadow: 0 0 8px #FF6600; }
        .error { color: #ff4444; margin: 0.7rem 0 0; font-weight: bold; }
        .footer {
            margin-top: 1.8rem;
            font-size: 0.7rem;
            text-align: center;
            border-top: 1px dashed #FF6600;
            padding-top: 1rem;
            opacity: 0.8;
        }
        a { color: #FF6600; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .log-line { color: #cc8844; font-size: 0.8rem; }
    </style>
</head>
<body>
<div class="terminal">
    <div class="header">
        <div class="logo">/// АРХИВ «КОБАЛЬТ» ///</div>
        <div class="status"># ВНЕШНЕЕ ПОДКЛЮЧЕНИЕ</div>
    </div>
    <div id="sysMessages">
        <div class="sys-msg">[>] Инициализация защищённого канала...</div>
        <div class="sys-msg">[>] Обход систем обнаружения [OK]</div>
        <div class="sys-msg">[>] Доступ к архиву предоставлен.</div>
    </div>
    <div class="cli">
        <div class="prompt">$ АВТОРИЗАЦИЯ</div>
        <div class="input-line">
            <span style="color:#FF6600;">&gt;</span>
            <input type="text" id="cobaltInput" placeholder="введите_идентификатор_доступа" autocomplete="off">
            <button id="cobaltBtn">ВОЙТИ</button>
        </div>
        <div id="errorMsg" class="error"></div>
    </div>
    <div class="footer">
        <span class="log-line">[LOG] СЕАНС ЗАЛОГИРОВАН.</span> Анонимный архив. Правда не может быть скрыта.
    </div>
</div>
<script>
    const codes = {
        "COBALT-01": "cobalt_victory.html"
    };
    let failedAttempts = 0;
    function updateSysMessages() {
        const messages = [
            "[>] Проверка цифровой подписи... [ОТКЛЮЧЕНО]",
            "[!] Обнаружен запрос от неавторизованного источника.",
            "[>] Установка анонимного туннеля... [ГОТОВО]",
            "[>] Доступ к массиву данных «Кобальт» разрешён."
        ];
        const sysDiv = document.getElementById('sysMessages');
        if (sysDiv) {
            sysDiv.innerHTML = '';
            for (let i = 0; i < 2; i++) {
                const msgDiv = document.createElement('div');
                msgDiv.className = 'sys-msg';
                msgDiv.textContent = messages[Math.floor(Math.random() * messages.length)];
                sysDiv.appendChild(msgDiv);
            }
        }
    }
    updateSysMessages();
    setInterval(updateSysMessages, 16000);
    document.getElementById("cobaltBtn").addEventListener("click", function() {
        const code = document.getElementById("cobaltInput").value.trim().toUpperCase();
        const errorDiv = document.getElementById("errorMsg");
        errorDiv.innerText = "";
        if (codes[code]) {
            window.location.href = codes[code];
        } else {
            failedAttempts++;
            errorDiv.innerText = `ДОСТУП ЗАПРЕЩЁН // ПОПЫТКА ${failedAttempts}`;
            if (failedAttempts >= 3) {
                errorDiv.innerText += " // ВРЕМЕННАЯ БЛОКИРОВКА (30 СЕК)";
                document.getElementById("cobaltBtn").disabled = true;
                setTimeout(() => {
                    document.getElementById("cobaltBtn").disabled = false;
                    errorDiv.innerText = "";
                }, 30000);
            } else {
                setTimeout(() => { errorDiv.innerText = ""; }, 4000);
            }
        }
        document.getElementById("cobaltInput").value = "";
    });
    document.getElementById("cobaltInput").addEventListener("keypress", function(e) {
        if (e.key === "Enter") document.getElementById("cobaltBtn").click();
    });
</script>
</body>
</html>
